# Secret scanning configuration.
#
# Extends the default gitleaks rules and only allow-lists values that are
# documented, non-secret placeholders in the repository. Anything that looks
# like a real credential must be reported.
#
# This file must NEVER contain a literal credential. The historical values that
# were committed before the security hardening are allow-listed by commit hash
# and by path (the immutable EF migration snapshots) until the git history is
# rewritten. Remove the `commits` entries after the rewrite; the migration
# paths can stay because migrations are historical artifacts.
[extend]
useDefault = true

[allowlist]
description = "Documented development placeholders and immutable historical artifacts"
regexes = [
  '''PLACEHOLDER''',
  '''(?i)changeme''',
  '''(?i)your[-_]?(password|secret|token|key)''',
  '''sb-[a-z0-9]+@business\.example\.com''',
]
paths = [
  # The 2021 seed inserted an administrator whose password hash is embedded in
  # these immutable migration files. The account is removed by
  # 20261030110352_RemoveSeededAdminUser; the hash is retained only because EF
  # migrations must not be rewritten.
  '''eCommerce\.Storefront\.Repository\.EntityFrameworkCore/Migrations/20220225191914_876B8763-3291-4714-80F2-FE7E6A7EF2EB\.cs''',
  '''eCommerce\.Storefront\.Repository\.EntityFrameworkCore/Migrations/20220225191914_876B8763-3291-4714-80F2-FE7E6A7EF2EB\.Designer\.cs''',
  '''eCommerce\.Storefront\.Repository\.EntityFrameworkCore/Migrations/20260914135828_ResolveCircularBasketCustomerRelationship\.cs''',
  '''eCommerce\.Storefront\.Repository\.EntityFrameworkCore/Migrations/20260914135828_ResolveCircularBasketCustomerRelationship\.Designer\.cs''',
  '''eCommerce\.Storefront\.Repository\.EntityFrameworkCore/Migrations/20260915175805_ApplyFourthPassFixes\.Designer\.cs''',
  '''eCommerce\.Storefront\.Repository\.EntityFrameworkCore/Migrations/20261030110352_RemoveSeededAdminUser\.cs''',
  # Local databases are ignored by git; a deleted one may still be in history.
  '''(?i).*\.db$''',
]
commits = [
  # Burned values that were removed by the hardening commits. These entries keep
  # the full-history scan green until the history is rewritten (OPERATIONAL).
