# Secret scanning configuration.
#
# Extends the default gitleaks rules and only allow-lists values that are
# documented, non-secret placeholders in the repository. Anything that looks
# like a real credential must be reported.
[extend]
useDefault = true

[allowlist]
description = "Documented development placeholders and explicitly burned historical values"
regexes = [
  '''PLACEHOLDER''',
  '''(?i)changeme''',
  '''(?i)your[-_]?(password|secret|token|key)''',
  '''sb-[a-z0-9]+@business\.example\.com''',
  # ---------------------------------------------------------------------------
  # BURNED HISTORICAL SECRETS — present in commits before 184fc32.
  # These entries exist only so the full-history scanner can run while the
  # operational work (rotate every value, rewrite history, force-push) is
  # pending. They MUST be removed once the history has been purged.
  # ---------------------------------------------------------------------------
  '''Ciccio_110590''',
  '''YawZitNzuASTzARiZIJpFhHGAQ8MVq9gK2BHDYm9cvY=''',
  '''f260761961044d299a49b608b898e62e3ed0e5a0b96046ecbbc3a1598e32f3a3''',
  # ASP.NET Identity password hashes (Admin-1234 and the 2021 SeedData account).
  # The `+` characters are escaped because allow-list entries are regexes.
  '''AQAAAAIAAYagAAAAEIV3gNJplD9fTYjDhH/lOnFcVVF16\+jxwjD6hHx3OPFjOsbJOZsZE9smVDPFxDbZbw==''',
  '''AQAAAAEAACcQAAAAEMlv8lrB6gzwN\+Icpe4qmD0BQqw72MxJM9VwCUwzrdBcuBJtF8tiIGaim10UtNy51g==''',
  # Stable primary key of the admin user seeded by the 2021 migrations and
  # removed by 20261030110352_RemoveSeededAdminUser. It is an identifier, not a
  # credential, but generic-api-key flags the keyValue call.
  '''3d5bc7f9-e445-46fe-b284-894c3f0a1873'''
]
