name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0

    - name: Scan for committed secrets
      uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # The action scans the commits in the event only. A full-history scan catches
    # credentials that were committed and later deleted (deleting a file does not
    # un-leak it). Burned values are allow-listed in .gitleaks.toml only until the
    # history rewrite is completed.
    - name: Scan the full git history for committed secrets
      run: |
        docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
          detect --source=/repo --log-opts="--all" --redact --verbose --exit-code=1

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --no-restore --verbosity normal

    - name: Audit NuGet packages for known vulnerabilities
      shell: bash
      run: |
        output=$(dotnet list package --vulnerable --include-transitive 2>&1)
        echo "$output"

        if echo "$output" | grep -q "has the following vulnerable packages"; then
          echo "::error::Vulnerable NuGet packages detected."
          exit 1
        fi
