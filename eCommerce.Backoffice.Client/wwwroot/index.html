<html>

<head>

    <title>eCommerce back office</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />

    <div id="app">
        <div class="loading-section">
            <h2>Welcome</h2>
            <div class="short-description" id="loadingText"></div>

        <a class="dismiss">x</a>
